var syncEnabled = firebaseConfig.apiKey.indexOf('YOUR_') !== 0;
var docRef = null;
var lastSyncedJSON = null;
var applyingRemote = false;

function setSyncDot(color, title){
  var el = document.getElementById('syncDot');
  if(!el) return;
  el.style.color = color || '#C9BFA0';
  if(title) el.title = title;
}

function isEditingFocused(){
  var a = document.activeElement;
  return a && (a.tagName==='INPUT' || a.tagName==='TEXTAREA' || a.tagName==='SELECT');
}

function initSync(){
  if(!syncEnabled) return;
  try{
    firebase.initializeApp(firebaseConfig);
    docRef = firebase.firestore().collection('nyc-trip-plan').doc('itinerary');
  }catch(e){ console.error('Firebase init failed', e); syncEnabled = false; }
}

function loadSyncedData(){
  if(!syncEnabled || !docRef) return Promise.resolve();
  return docRef.get().then(function(snap){
    if(snap.exists && snap.data() && snap.data().days){
      DAYS = snap.data().days;
      if(snap.data().plan && PLANS[snap.data().plan]) currentPlan = snap.data().plan;
      lastSyncedJSON = JSON.stringify(DAYS);
      renderPlanSelector();
    } else {
      lastSyncedJSON = JSON.stringify(DAYS);
      docRef.set({ days: DAYS, plan: currentPlan, updatedAt: Date.now() });
    }
    setSyncDot('#6fbf73', '同期中');
    listenForRemoteChanges();
  }).catch(function(e){
    console.error('load failed', e);
    setSyncDot('#c0392b', '同期エラー');
  });
}

function listenForRemoteChanges(){
  docRef.onSnapshot(function(snap){
    if(!snap.exists || !snap.data() || !snap.data().days) return;
    var json = JSON.stringify(snap.data().days);
    if(json === lastSyncedJSON) return;
    lastSyncedJSON = json;
    if(isEditingFocused()) return; // don't disrupt someone mid-edit
    DAYS = snap.data().days;
    if(snap.data().plan && PLANS[snap.data().plan]) currentPlan = snap.data().plan;
    applyingRemote = true;
    renderPlanSelector(); renderSchedule(); renderMap(); renderLegend(); renderAreaTable();
    applyingRemote = false;
  }, function(e){ console.error('listen failed', e); setSyncDot('#c0392b','同期エラー'); });
}

function saveSyncedData(){
  if(!syncEnabled || !docRef || applyingRemote) return;
  var json = JSON.stringify(DAYS);
  if(json === lastSyncedJSON) return;
  lastSyncedJSON = json;
  docRef.set({ days: DAYS, plan: currentPlan, updatedAt: Date.now() }).catch(function(e){
    console.error('save failed', e); setSyncDot('#c0392b','保存エラー');
  });
}

/* ================= MAP ================= */
function initMap(){
  map = L.map('map', {scrollWheelZoom:false, zoomControl:true});
  var tileLoaded = false;
  tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OpenStreetMap contributors', maxZoom:19, subdomains:'abc'
  });
  tileLayer.on('tileload', function(){ tileLoaded = true; });
  tileLayer.on('tileerror', function(){ document.getElementById('fallback').style.display='block'; });
  tileLayer.addTo(map);
  setTimeout(function(){ if(!tileLoaded){ document.getElementById('fallback').style.display='block'; } }, 3500);
}

function pinIcon(color, num){
  return L.divIcon({ className:"", html:'<div class="pin" style="background:'+color+'"><span>'+num+'</span></div>', iconSize:[22,22], iconAnchor:[11,22], tooltipAnchor:[0,-20] });
}

function renderMap(){
  mapLayers.forEach(function(l){ map.removeLayer(l); });
  mapLayers = [];
  var fitPts = [];
  var num = 0;

  DAYS.forEach(function(day){
    var color = COLORS[day.color];
    var prevPt = null;
    day.stops.forEach(function(s){
      if(s.lat==null || s.lon==null) { return; }
      num++;
      var pt = [s.lat, s.lon];
      var marker = L.marker(pt, {icon:pinIcon(color, num)}).addTo(map).bindTooltip(s.name, {className:'pin-tip', direction:'top'});
      mapLayers.push(marker);
      if(!s.excludeFromFit) fitPts.push(pt);
      if(prevPt && s.transport && s.transport!=='none'){
        var line = L.polyline([prevPt, pt], {color:color, weight:3.5, opacity:0.9, dashArray:DASH[s.transport]||null, lineJoin:'round'}).addTo(map);
        mapLayers.push(line);
      }
      prevPt = pt;
    });
  });

  if(fitPts.length){ map.fitBounds(L.latLngBounds(fitPts), {padding:[22,22]}); }
}

function renderPlanSelector(){
  var root = document.getElementById('plan-selector');
  if(!root) return;
  root.innerHTML = Object.keys(PLANS).map(function(key){
    var p = PLANS[key];
    var active = key === currentPlan;
    return '<div class="plan-card'+(active?' active':'')+'" data-plan="'+key+'">'+
      '<div class="p-head"><span class="p-name">'+key+'. '+esc(p.label)+'</span><span class="p-badge">選択中</span></div>'+
      '<div class="p-tag">'+esc(p.tag)+'</div>'+
      '<div class="p-desc">'+esc(p.desc)+'</div>'+
    '</div>';
  }).join('');
  root.querySelectorAll('.plan-card').forEach(function(card){
    card.addEventListener('click', function(){
      var key = card.dataset.plan;
      if(key === currentPlan) return;
      if(confirm('プランを切り替えると、個別に手入力した編集内容は上書きされます。続行しますか？')){
        currentPlan = key;
        DAYS = buildDays(currentPlan);
        renderPlanSelector(); renderSchedule(); renderMap(); renderLegend(); renderAreaTable();
        saveSyncedData();
      }
    });
  });
}

          '<input class="ed" data-di="'+di+'" data-f="title" value="'+esc(day.title)+'" placeholder="タイトル">'+
        '</div>'+
        '<div style="width:40%"><input class="ed" data-di="'+di+'" data-f="area" value="'+esc(day.area)+'" placeholder="エリア"></div>';
    } else {
      head.innerHTML =
        '<div><div class="d-date">'+esc(day.weekday)+' / '+esc(day.date)+'</div><h3>'+esc(day.title)+'</h3></div>'+
        '<div class="d-area">'+esc(day.area).replace(/（/g,'<br>（')+'</div>';
    }
    card.appendChild(head);

    var tl = document.createElement('div'); tl.className = 'timeline';

    day.stops.forEach(function(s, si){
      var hasPin = s.lat!=null && s.lon!=null;
      var myNum = null;
      if(hasPin){ num++; myNum = num; }

      var row = document.createElement('div');
      if(editMode){
        row.className = 'stop editing';
        row.innerHTML =
          '<span class="ed-label">時刻／時間帯</span><input class="ed" data-di="'+di+'" data-si="'+si+'" data-f="time" value="'+esc(s.time)+'">'+
          '<span class="ed-label">施設名</span><input class="ed" data-di="'+di+'" data-si="'+si+'" data-f="name" value="'+esc(s.name)+'">'+
          '<span class="ed-label">概要</span><textarea class="ed" data-di="'+di+'" data-si="'+si+'" data-f="desc" rows="2">'+esc(s.desc)+'</textarea>'+
          '<div class="ed-row3">'+
            '<div><span class="ed-label">緯度</span><input class="ed" data-di="'+di+'" data-si="'+si+'" data-f="lat" value="'+(s.lat==null?'':s.lat)+'"></div>'+
            '<div><span class="ed-label">経度</span><input class="ed" data-di="'+di+'" data-si="'+si+'" data-f="lon" value="'+(s.lon==null?'':s.lon)+'"></div>'+
            '<div><span class="ed-label">前施設からの移動</span>'+
              '<select class="ed" data-di="'+di+'" data-si="'+si+'" data-f="transport">'+
                ['none','walk','subway','ferry','car'].map(function(t){ return '<option value="'+t+'"'+(s.transport===t?' selected':'')+'>'+transportLabel(t)+'</option>'; }).join('')+
              '</select>'+
            '</div>'+
          '</div>'+
          '<span class="ed-label">タグ（任意・例：事前予約推奨）</span><input class="ed" data-di="'+di+'" data-si="'+si+'" data-f="tag" value="'+esc(s.tag||'')+'">'+
          '<div class="edit-actions">'+
            '<button class="icon-btn" data-act="up" data-di="'+di+'" data-si="'+si+'">▲</button>'+
            '<button class="icon-btn" data-act="down" data-di="'+di+'" data-si="'+si+'">▼</button>'+
            '<button class="icon-btn danger" data-act="del" data-di="'+di+'" data-si="'+si+'">🗑 削除</button>'+
          '</div>';
      } else {
        row.className = 'stop';
        var numHtml = myNum ? '<div class="pinnum" style="background:var(--'+day.color+')">'+myNum+'</div>' : '<div class="nopin"></div>';
        var tagHtml = s.tag ? ' <span class="tag">'+esc(s.tag)+'</span>' : '';
        var mapUrl = s.map || (hasPin ? ('https://www.google.com/maps/search/?api=1&query='+s.lat+','+s.lon) : null);
        var mapHtml = mapUrl ? ' <a class="maplink" target="_blank" rel="noopener" href="'+mapUrl+'">📍 Google Mapsで開く</a>' : '';
        row.innerHTML = numHtml+'<div class="t">'+esc(s.time)+'</div><div class="info"><div class="name">'+esc(s.name)+'</div><div class="desc">'+esc(s.desc)+tagHtml+'</div>'+mapHtml+'</div>';
      }
      tl.appendChild(row);
    });

    card.appendChild(tl);

    if(editMode){
      var addBtn = document.createElement('button');
      addBtn.className = 'add-stop-btn';
      addBtn.textContent = '+ 施設を追加';
      addBtn.dataset.di = di;
      addBtn.dataset.act = 'add';
      card.appendChild(addBtn);
    } else if(day.note){
      var note = document.createElement('div'); note.className = 'day-note'; note.textContent = day.note;
      card.appendChild(note);
    }

    root.appendChild(card);
  });

  wireEvents();
}

function wireEvents(){
  var root = document.getElementById('schedule-root');

  root.querySelectorAll('input.ed, textarea.ed, select.ed').forEach(function(input){
    var isMapField = (input.dataset.f === 'lat' || input.dataset.f === 'lon' || input.dataset.f === 'transport');
    input.addEventListener('input', function(){ applyField(input, false); });
    input.addEventListener('change', function(){ applyField(input, true); });
  });

  root.querySelectorAll('button[data-act]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var act = btn.dataset.act, di = +btn.dataset.di, si = btn.dataset.si!=null ? +btn.dataset.si : null;
      var day = DAYS[di];
      if(act === 'add'){ day.stops.push(blankStop()); }
      else if(act === 'del'){ day.stops.splice(si,1); }
      else if(act === 'up' && si>0){ var tmp=day.stops[si-1]; day.stops[si-1]=day.stops[si]; day.stops[si]=tmp; }
      else if(act === 'down' && si<day.stops.length-1){ var tmp2=day.stops[si+1]; day.stops[si+1]=day.stops[si]; day.stops[si]=tmp2; }
      renderSchedule(); renderMap(); renderLegend(); renderAreaTable();
      saveSyncedData();
    });
  });
}

function applyField(input, alsoRenderMap){
  var di = +input.dataset.di, f = input.dataset.f;
  var target = (input.dataset.si!=null) ? DAYS[di].stops[+input.dataset.si] : DAYS[di];
  var v = input.value;
  if(f==='lat' || f==='lon'){ target[f] = v===''? null : parseFloat(v); }
  else { target[f] = v; }
  if(alsoRenderMap){ renderMap(); renderLegend(); renderAreaTable(); saveSyncedData(); }
}

/* ================= RESIZABLE SPLIT ================= */
function initResizer(){
  var fixedTop = document.querySelector('.fixed-top');
  var resizer = document.getElementById('resizer');
  var app = document.querySelector('.app');
  var dragging = false;

  function clamp(px){
    var min = window.innerHeight * 0.18;
    var max = window.innerHeight * 0.82;
    return Math.max(min, Math.min(max, px));
  }
  function setHeight(px){
    fixedTop.style.flex = '0 0 ' + clamp(px) + 'px';
    if(map) setTimeout(function(){ map.invalidateSize(); }, 0);
  }

  function onMove(clientY){
    var rect = app.getBoundingClientRect();
    setHeight(clientY - rect.top);
  }

  resizer.addEventListener('pointerdown', function(e){
    dragging = true;
    resizer.setPointerCapture(e.pointerId);
    document.body.style.userSelect = 'none';
  });
  resizer.addEventListener('pointermove', function(e){
    if(!dragging) return;
    onMove(e.clientY);
  });
  resizer.addEventListener('pointerup', function(e){
    dragging = false;
    document.body.style.userSelect = '';
    resizer.releasePointerCapture(e.pointerId);
  });
  resizer.addEventListener('pointercancel', function(){
    dragging = false;
    document.body.style.userSelect = '';
  });
}

/* ================= EDIT TOGGLE ================= */
document.getElementById('editFab').addEventListener('click', function(){
  editMode = !editMode;
  this.textContent = editMode ? '✓ 完了' : '✎ 編集';
  this.classList.toggle('active', editMode);
  renderSchedule();
});

/* ================= INIT ================= */
initMap();
initResizer();
initSync();
renderPlanSelector();
renderLegend();
renderAreaTable();
renderSchedule();
renderMap();
if(syncEnabled){ loadSyncedData(); } else { setSyncDot('#C9BFA0'); }

}catch(err){
  console.error('Init error:', err);
  document.getElementById('fallback').style.display = 'block';
}
});
